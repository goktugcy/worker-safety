name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run tests
        run: composer test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer analyse

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer lint

  self-scan:
    name: Self scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # The analyzer must be clean on its own source.
      - name: Scan src/
        run: bin/worker-safety scan src --fail-on=medium --no-ansi

      - name: Smoke-test every command and format
        run: |
          bin/worker-safety --version
          bin/worker-safety rules
          bin/worker-safety rules WS001
          bin/worker-safety rules --format=json > /dev/null
          bin/worker-safety scan tests/Fixtures --fail-on=never --no-ansi > /dev/null
          bin/worker-safety scan tests/Fixtures --fail-on=never --format=json | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
          bin/worker-safety scan tests/Fixtures --fail-on=never --format=sarif | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
