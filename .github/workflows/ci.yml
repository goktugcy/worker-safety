name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run tests
        run: composer test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer analyse

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer lint

  self-scan:
    name: Self scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # The analyzer must be clean on its own source.
      - name: Scan src/
        run: bin/worker-safety scan src --fail-on=medium --no-ansi

      - name: Smoke-test every command and format
        run: |
          bin/worker-safety --version
          bin/worker-safety rules
          bin/worker-safety rules WS001
          bin/worker-safety rules --format=json > /dev/null
          bin/worker-safety scan tests/Fixtures --allow-parse-errors --fail-on=never --no-ansi > /dev/null
          bin/worker-safety scan tests/Fixtures --allow-parse-errors --fail-on=never --format=json | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
          bin/worker-safety scan tests/Fixtures --allow-parse-errors --fail-on=never --format=sarif | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
          bin/worker-safety test --help

      # The reviewer's question, as a CI gate: the same class passes the static
      # scan and fails the replay. Uses the pure-PHP fixture worker, so neither
      # FrankenPHP nor Octane is needed here.
      - name: Static analysis passes on the replay fixture
        run: bin/worker-safety scan tests/Fixtures/Replay/static-safe --fail-on=high --no-ansi

      - name: Replay catches the leak the static scan cannot prove
        run: |
          php tests/Fixtures/Replay/leaky-worker/server.php 0 60 > /tmp/worker.log 2>&1 &
          for i in $(seq 1 50); do
            PORT=$(sed -n 's/^PORT=//p' /tmp/worker.log | head -1)
            [ -n "$PORT" ] && break
            sleep 0.2
          done
          test -n "$PORT" || { echo 'fixture worker never reported a port'; cat /tmp/worker.log; exit 1; }

          set +e
          bin/worker-safety test \
            --scenario=tests/Fixtures/Replay/leaky-worker/scenario.yaml \
            --base-url="http://127.0.0.1:$PORT" --no-ansi
          STATUS=$?
          set -e

          test "$STATUS" -eq 1 || { echo "expected exit 1 from replay, got $STATUS"; exit 1; }
          echo 'replay reported the cross-request leak and exited 1, as expected'

      # The control: the SAME unmodified scenario against a worker whose only
      # difference is where `new RequestContext()` sits. Without this, a
      # permanently failing assertion would look identical to a working one.
      - name: Replay passes against the fixed worker
        run: |
          php tests/Fixtures/Replay/fixed-worker/server.php 0 60 > /tmp/fixed.log 2>&1 &
          for i in $(seq 1 50); do
            PORT=$(sed -n 's/^PORT=//p' /tmp/fixed.log | head -1)
            [ -n "$PORT" ] && break
            sleep 0.2
          done
          test -n "$PORT" || { echo 'fixed worker never reported a port'; cat /tmp/fixed.log; exit 1; }

          bin/worker-safety test \
            --scenario=tests/Fixtures/Replay/leaky-worker/scenario.yaml \
            --base-url="http://127.0.0.1:$PORT" --no-ansi
          echo 'the same scenario passed against the fixed worker, as expected'

      - name: Replay JSON output is pure JSON
        run: |
          php tests/Fixtures/Replay/leaky-worker/server.php 0 60 > /tmp/worker2.log 2>&1 &
          for i in $(seq 1 50); do
            PORT=$(sed -n 's/^PORT=//p' /tmp/worker2.log | head -1)
            [ -n "$PORT" ] && break
            sleep 0.2
          done
          test -n "$PORT"
          set +e
          bin/worker-safety test tests/Fixtures/Replay/leaky-worker/scenario.yaml \
            --base-url="http://127.0.0.1:$PORT" --format=json > /tmp/replay.json
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          php -r '$r = json_decode(file_get_contents("/tmp/replay.json"), true, 512, JSON_THROW_ON_ERROR); exit($r["passed"] === false ? 0 : 1);'

  symfony-8:
    name: Symfony 8 / PHP 8.4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      # `config.platform.php` pins resolution to 8.2 so that the committed lock
      # matches the lowest supported PHP. Symfony 8 requires PHP >= 8.4, so with
      # that pin in place it can never be selected and this job would silently
      # test Symfony 7 again. Dropping the pin here is what makes the job real.
      #
      # Decoding without `assoc` keeps empty objects (`config.policy`) as
      # objects; `composer config --unset` rewrites them as `[]` and then fails
      # its own schema validation.
      - name: Drop the platform pin so Symfony 8 is selectable
        run: |
          php -r '$f = "composer.json";
            $d = json_decode(file_get_contents($f));
            unset($d->config->platform);
            file_put_contents($f, json_encode($d, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n");'

      - name: Install with Symfony 8
        run: composer update --no-interaction --with="symfony/console:^8.0" --with="symfony/yaml:^8.0"

      - name: Confirm Symfony 8 was actually installed
        run: |
          composer show symfony/console | grep -E '^versions.*\*? v8\.' \
            || { echo 'symfony/console 8 was not installed'; composer show symfony/console; exit 1; }

      - name: Run tests
        run: composer test

      - name: Smoke-test the binary
        run: |
          bin/worker-safety scan src --fail-on=medium --no-ansi
          bin/worker-safety scan tests/Fixtures --allow-parse-errors --fail-on=never --format=json | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
          bin/worker-safety scan tests/Fixtures --allow-parse-errors --fail-on=never --format=sarif | php -r 'exit(json_decode(stream_get_contents(STDIN)) === null ? 1 : 0);'
